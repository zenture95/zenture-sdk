[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zenture-sdk"
dynamic = ["version"]
description = "Official Python SDK for the zenture Public API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "zenture UG (haftungsbeschraenkt)" },
]
keywords = ["zenture", "sdk", "api", "ai", "evaluation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "twine>=6.0",
  "coverage[toml]>=7.6",
]

[project.urls]
Homepage = "https://github.com/zenture95/zenture-sdk"
Repository = "https://github.com/zenture95/zenture-sdk"
Issues = "https://github.com/zenture95/zenture-sdk/issues"

[tool.hatch.version]
path = "src/zenture/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/openapi",
  "/README.md",
  "/SECURITY.md",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zenture"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["zenture"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
